<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A Field Guide to Northwest Tucson's Washes: Full-Page Map | Fink Geospatial</title>
  <meta name="description" content="The wash map at full size: every channel between the Tucson Mountains and the Santa Catalinas, traced from one-metre lidar.">
  <meta name="theme-color" content="#008080">
  <meta property="og:type" content="website">
  <meta property="og:title" content="A Field Guide to Northwest Tucson's Washes: Full-Page Map | Fink Geospatial">
  <meta property="og:url" content="https://finkgeo.com/tucson-washes/map/">
  <link rel="canonical" href="https://finkgeo.com/tucson-washes/">
  <link rel="icon" href="/assets/globe.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css" integrity="sha512-qN/uDg9bS3IAldWq4lswyC+9ZSoShtfyNDp+FaJhdtXJqdgubHA+s4nB8BajW0m90Y0+RBGbqu2anzbxiQYdHA==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="stylesheet" href="/tucson-loop-access/loop.css">
  <link rel="stylesheet" href="/kxci-signal/kxci.css">
  <link rel="stylesheet" href="/tucson-washes/washes.css">
</head>
<body class="loopviz kxciviz washviz fullmap">
  <main class="viewer">
    <h1 class="sr-only">A Field Guide to Northwest Tucson's Washes: full-page map</h1>
    <div class="titlebar">
      <img src="/assets/globe.svg" alt="" width="16" height="16">
      <span class="t">Wash Viewer: Channels Traced from Lidar</span>
      <span class="ctl" aria-hidden="true"><i>_</i><i>&#9633;</i><i>&times;</i></span>
    </div>
    <div class="toolbar">
      <button type="button" id="tb-in">Zoom In</button>
      <button type="button" id="tb-out">Zoom Out</button>
      <button type="button" id="tb-full">Full Extent</button>
      <button type="button" id="tb-base" aria-pressed="true">Satellite</button>
      <a class="tb-link" href="/tucson-washes/" data-carry="/tucson-washes/">&laquo; Back to Project Page</a>
    </div>
    <noscript><div class="note"><p>The map needs JavaScript. <a href="/tucson-washes/">Back to the project page</a>.</p></div></noscript>
    <fieldset class="groupbox">
      <legend>Settings</legend>
      <div class="row">
        <span id="mode-label">Colour the washes by</span>
        <div class="toolbar" id="mode-buttons" role="group" aria-labelledby="mode-label"></div>
      </div>
      <div class="row">
        <span id="show-label">Show</span>
        <div class="toolbar" id="show-buttons" role="group" aria-labelledby="show-label"></div>
      </div>
    </fieldset>
    <div class="map-canvas">
      <div id="map" role="region" aria-label="Map of wash channels in northwest Tucson"></div>
      <p id="map-error" class="map-error" role="alert" hidden></p>
    </div>
    <ul class="legend" id="map-legend"></ul>
    <div class="statusbar"><span id="sb-msg" aria-live="polite">Loading&hellip;</span><span id="sb-pos">&nbsp;</span></div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js" integrity="sha512-dXgoFR02YHJ9Fa29P3D/1umNaZ0EXS2N0w29Lm3b/1BK8UDLMdLWDFwuujIyJJdU27/PLuk3dmS1V9NO8ABX1A==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="/tucson-washes/washes.js"></script>
</body>
</html>
