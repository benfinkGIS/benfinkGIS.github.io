<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kit Fox Release Sites: Full-Page Map | Fink Geospatial</title>
  <meta name="description" content="The kit fox release suitability map at full size: step through the eight criteria, change the weights, and see the shortlisted areas.">
  <meta name="theme-color" content="#008080">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Kit Fox Release Sites: Full-Page Map | Fink Geospatial">
  <meta property="og:url" content="https://finkgeo.com/kit-fox-release/map/">
  <link rel="canonical" href="https://finkgeo.com/kit-fox-release/">
  <link rel="icon" href="/assets/globe.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" integrity="sha512-Zcn6bjR/8RZbLEpLIeOwNtzREBAJnUKESxces60Mpoj+2okopSAcSUIUOseddDm0cxnGQzxIR7vJgsLZbdLE3w==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="stylesheet" href="/kit-fox-release/kitfox.css">
</head>
<body class="kitviz kitfull">
  <main class="viewer" id="wizard">
    <h1 class="sr-only">Kit Fox Release Sites: full-page map</h1>
    <div class="titlebar">
      <img src="/assets/globe.svg" alt="" width="16" height="16">
      <span class="t">Kit Fox Release Wizard</span>
      <span class="ctl" aria-hidden="true"><i>_</i><i>&#9633;</i><i>&times;</i></span>
    </div>
    <div class="toolbar">
      <button type="button" id="tb-in">Zoom In</button>
      <button type="button" id="tb-out">Zoom Out</button>
      <button type="button" id="tb-full">Full Extent</button>
      <button type="button" id="tb-labels" aria-pressed="true">Labels</button>
      <button type="button" id="tb-desig" aria-pressed="false">Designations</button>
      <a class="tb-link" href="/kit-fox-release/" data-carry="/kit-fox-release/">&laquo; Back to Project Page</a>
    </div>
    <noscript><div class="note"><p>The map needs JavaScript. <a href="/kit-fox-release/">Back to the project page</a>.</p></div></noscript>
    <div class="wiz">
      <div class="wiz-pane">
        <label class="wiz-jump"><span>Go to</span>
          <select id="wiz-jump" aria-label="Go to a step"></select>
        </label>
        <div class="wiz-text" id="wiz-text" aria-live="polite"></div>
        <div class="wiz-foot">
          <div class="progress" aria-hidden="true"><i id="wiz-bar"></i></div>
          <div class="wiz-nav">
            <span id="wiz-count">&nbsp;</span>
            <button type="button" class="btn" id="wiz-back">&lt; Back</button>
            <button type="button" class="btn default" id="wiz-next">Next &gt;</button>
          </div>
        </div>
      </div>
      <div class="map-canvas">
        <div id="map" role="region" aria-label="Map of kit fox suitability scores within 100 miles of the center"></div>
        <p id="map-error" class="map-error" role="alert" hidden></p>
      </div>
    </div>
    <div class="scalebar" id="scalebar">
      <span>Poor: 3 or less</span><i id="scale-ramp"></i><span>Good: 9 or more</span>
      <span class="key"><i class="ring"></i>Search area</span>
      <span class="key" id="key-short" hidden><i class="cand"></i>Shortlisted area, shown to within about 10 km</span>
      <span class="key desig" id="key-desig" hidden></span>
    </div>
    <div class="statusbar"><span id="sb-msg" aria-live="polite">Loading&hellip;</span><span id="sb-pos">&nbsp;</span></div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js" integrity="sha512-BwHfrr4c9kmRkLw6iXFdzcdWV/PGkVgiIyIWLLlTSXzWQzxuSg4DiQUCpauz/EWjgk5TYQqX/kvn9pG1NpYfqg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="/kit-fox-release/kitfox.js"></script>
</body>
</html>
